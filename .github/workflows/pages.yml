name: Publish VaciPet to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-paste/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend-paste/frontend
      - name: Build site
        run: npm run build --prefix frontend-paste/frontend
        env:
          GITHUB_PAGES: 'true'
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - name: Add SPA fallback
        run: cp frontend-paste/frontend/dist/index.html frontend-paste/frontend/dist/404.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend-paste/frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
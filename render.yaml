services:
  - type: web
    name: vacipet-api
    runtime: docker
    rootDir: backend-paste
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vacipet-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: FRONTEND_URL
        sync: false

databases:
  - name: vacipet-db
    databaseName: vacipet
    user: vacipet

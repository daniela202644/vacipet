services:
  - type: web
    name: vacipet
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci --prefix backend-paste && npm ci --prefix frontend-paste/frontend && npm run build --prefix frontend-paste/frontend
    startCommand: npm start --prefix backend-paste
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vacipet-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: vacipet-db
    plan: 0.5c-1g
    databaseName: vacipet
    user: vacipet
    ipAllowList: []